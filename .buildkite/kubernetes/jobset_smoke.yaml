# Smoke test for the JobSet launcher path: two single-chip pods admitted as one
# gang. Uses the whole v6e-1 nominal quota, so running it alongside the v6e-8
# reclaim step exercises preemption of a multi-pod workload.
#
# The launcher fills in metadata.name, namespace, correlation labels and the
# ownerReference. Everything else is declared here - unlike the single-pod
# queues, the controller does not inject node selectors or resource classes
# into a JobSet, so the manifest is the complete spec.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  labels:
    # Selects the Kueue LocalQueue, and therefore the ResourceFlavor and quota.
    # On a JobSet this must be on the JobSet, not on the inner Jobs.
    kueue.x-k8s.io/queue-name: v6e-1-1x1
spec:
  # Bounded in the worker cluster itself, so it still applies if the manager
  # becomes unreachable and nothing upstream can clean the workload up.
  ttlSecondsAfterFinished: 300
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - workers
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          parallelism: 2
          completions: 2
          completionMode: Indexed
          backoffLimit: 0
          activeDeadlineSeconds: 1800
          template:
            spec:
              restartPolicy: Never
              nodeSelector:
                tpu-ci.google.com/profile: v6e-1-1x1
              tolerations:
                - key: "google.com/tpu"
                  operator: "Equal"
                  value: "present"
                  effect: "NoSchedule"
              containers:
                - name: worker
                  image: "debian:bookworm-slim"
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      echo "gang member $${JOB_COMPLETION_INDEX} up, holding 1 chip"
                      sleep 240
                      echo "gang member $${JOB_COMPLETION_INDEX} done"
                  resources:
                    limits:
                      google.com/tpu: "1"
                    requests:
                      google.com/tpu: "1"
