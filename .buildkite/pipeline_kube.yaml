# GKE TPU autoscaling (scale from zero) and Kueue cohort borrowing/preemption.
# Total capacity: 10 chips in the v6e cohort (v6e-1-1x1 nominal 2, v6e-8-2x4 nominal 8).
#
# Every TPU step goes through the launcher: it submits the real workload (a Job
# for single-pod work, a JobSet for multi-pod) and streams it back. The step
# names a profile; placement, chip count, Kueue queue and deadlines come from
# the cluster-side profile registry generated in ci-infra.
#
# No `retry:` on preemption. The agent runs on a CPU pod that Kueue does not
# manage, so eviction pauses the log rather than losing the agent.

# The workload image is the pipeline's choice, not the cluster's: real CI
# images are built per commit, so the cluster cannot know it. Set once here
# rather than per step. The launcher checks it against the cluster-side
# allowed_image_repos before submitting.
env:
  WORKLOAD_IMAGE: "debian:bookworm-slim"

.launcher: &launcher
  kubernetes:
    podTemplate: tpu-launcher

steps:
  # 6 single-chip workloads: 2 within nominal quota, 4 borrowed from the
  # cohort. Held long enough for the reclaim step to contend with them.
  - label: ":kubernetes: Borrow + preempt | v6e-1 %n"
    key: "v6e_1_jobs"
    if: "build.env('TEST_TYPE') == 'v6e1' || build.env('TEST_TYPE') == null"
    parallelism: 6
    agents:
      queue: "kube"
    plugins:
      - <<: *launcher
    command: /opt/launcher/launch --profile v6e-1-1x1 -- sleep 360

  # Reclaims the 8 chips its queue nominally owns, preempting whichever
  # borrowed single-chip workloads are in the way.
  - label: ":kubernetes: Quota reclaim | v6e-8"
    key: "v6e_8_job"
    if: "build.env('TEST_TYPE') == 'v6e8' || build.env('TEST_TYPE') == null"
    agents:
      queue: "kube"
    plugins:
      - <<: *launcher
    command: /opt/launcher/launch --profile v6e-8-2x4 -- sleep 30
